services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: lifecost_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "lifecost"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Web Service
  web:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lifecost_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_DATABASE=lifecost
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
